<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plays | Radio UTD Management</title>
  <style>
    body { font: 16px/1.45 sans-serif; margin: 2rem auto; max-width: 1100px; padding: 0 1rem; color: #222; }
    label { display: inline-block; margin: 0 1rem 1rem 0; }
    button, input, select { font: inherit; padding: .45rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #999; padding: .45rem; text-align: left; }
    th { background: #333; color: white; }
    .status { margin: .75rem 0; }
    .help { color: #444; max-width: 850px; }
    .totals { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
    .totals div { border: 1px solid #999; padding: .75rem 1rem; min-width: 140px; }
    .totals strong { display: block; font-size: 1.5rem; }
    .heatmap-wrap { overflow-x: auto; }
    .heatmap td, .heatmap th { padding: .2rem; text-align: center; font-size: .75rem; min-width: 1.6rem; }
  </style>
</head>
<body>
  <h1>Plays</h1>
  <p class="help">Everything logged from Zetta in the selected range. Show attribution uses the show stored when the song was logged, or the show scheduled at that time when none was stored.</p>

  <label>From
    <input id="from" type="date">
  </label>
  <label>To
    <input id="to" type="date">
  </label>
  <button id="load" type="button">Load</button>
  <p id="status" class="status" aria-live="polite"></p>

  <h2>Summary</h2>
  <div id="totals" class="totals"></div>

  <h2>Plays by day and hour</h2>
  <div class="heatmap-wrap">
    <table class="heatmap">
      <thead id="heatmap-head"></thead>
      <tbody id="heatmap-body"></tbody>
    </table>
  </div>

  <h2>Top plays</h2>
  <label>Group by
    <select id="type">
      <option value="song">Song</option>
      <option value="artist">Artist</option>
      <option value="album">Album</option>
    </select>
  </label>
  <label>Show
    <select id="show">
      <option value="">All shows</option>
    </select>
  </label>
  <table>
    <thead id="top-head"></thead>
    <tbody id="top-body"></tbody>
  </table>

  <script src="plays.js"></script>
</body>
</html>
