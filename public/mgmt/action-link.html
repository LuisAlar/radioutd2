<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Action Link | Radio UTD Management Interface</title>
</head>
<body>
  <div>
    <div>
      <label for="password">DJ Password: </label>
      <input type="password" name="password" id="password" required>
    </div>
    <div>
      <label for="title">Title (empty to remove action link): </label>
      <input type="text" name="title" id="title" required>
    </div>
    <div>
      <label for="link">Link (empty to remove action link): </label>
      <input type="url" name="link" id="link" required>
    </div>
    <div>
      <button id="submit">Submit</button>
    </div>
  </div>
  <script src="action-link.js"></script>
</body>
</html>
