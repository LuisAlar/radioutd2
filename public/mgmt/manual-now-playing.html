<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Now Playing (Manual) | Radio UTD Management Interface</title>
</head>
<body>
  <div>
    <div>
      <label for="password">Automation Password: </label>
      <input type="password" name="password" id="password" required>
    </div>
    <div>
      <label for="title">Title: </label>
      <input type="text" name="title" id="title" required>
    </div>
    <div>
      <label for="artist">Artist: </label>
      <input type="url" name="artist" id="artist" required>
    </div>
    <div>
      <label for="album">Album: </label>
      <input type="url" name="album" id="album" required>
    </div>
    <div>
      <button id="submit">Submit</button>
    </div>
  </div>
  <script src="manual-now-playing.js"></script>
</body>
</html>
